<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Tine </title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f7f3ff 0%, #e9d8a6 0%, #f3e8ff 50%, #d8b4fe 100%);
      --primary-purple: #7e22ce;
      --soft-purple: #9333ea;
      --accent-purple: #c084fc;
      --light-purple: #f3e8ff;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-color: #3b0764;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Floating Petals Background */
    .petal {
      position: absolute;
      background-color: #c084fc;
      border-radius: 15px 0px 15px 0px;
      opacity: 0.6;
      pointer-events: none;
      animation: float 10s infinite linear;
      z-index: 0;
    }

    @keyframes float {
      0% {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0.2;
      }
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      max-width: 500px;
      width: 100%;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(126, 34, 206, 0.15);
      border: 2px solid rgba(192, 132, 252, 0.3);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .flower-icon {
      font-size: 50px;
      margin-bottom: 10px;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    h1 {
      color: var(--primary-purple);
      font-size: 2.2rem;
      margin-bottom: 15px;
    }

    p {
      color: #581c87;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .card {
      background: var(--light-purple);
      border-left: 4px solid var(--primary-purple);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 25px;
      text-align: left;
    }

    .card h3 {
      color: var(--primary-purple);
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .card p {
      font-size: 0.95rem;
      margin-bottom: 0;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--soft-purple), var(--primary-purple));
      color: white;
      box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2deg);
      box-shadow: 0 6px 20px rgba(147, 51, 234, 0.4);
    }

    .btn-secondary {
      background: white;
      color: var(--primary-purple);
      border: 2px solid var(--accent-purple);
    }

    .btn-secondary:hover {
      background: var(--light-purple);
    }

    .hidden-message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #f3e8ff;
      border-radius: 12px;
      color: var(--primary-purple);
      font-weight: 600;
      animation: fadeIn 0.5s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10deg); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Background Flowers / Petals -->
  <div class="petal" style="left: 10%; width: 15px; height: 15px; animation-duration: 8s;"></div>
  <div class="petal" style="left: 25%; width: 20px; height: 20px; animation-duration: 12s; animation-delay: 2s;"></div>
  <div class="petal" style="left: 50%; width: 12px; height: 12px; animation-duration: 9s; animation-delay: 1s;"></div>
  <div class="petal" style="left: 75%; width: 18px; height: 18px; animation-duration: 11s; animation-delay: 3s;"></div>
  <div class="petal" style="left: 90%; width: 14px; height: 14px; animation-duration: 7s; animation-delay: 4s;"></div>

  <div class="container">
    <div class="flower-icon">🪻🌸🪻</div>
    <h1>Sorry na, Tine </h1>
    
    <p>
      Tineeee, sorry na ml na tayooo
    </p>

    <div class="card">
      <h3> Promise :</h3>
      <p>hinde na me mang ghost promise tinee.</p>
    </div>

    <div class="buttons">
      <button class="btn-primary" onclick="showForgiveness()">Bati na tayo? </button>
      <button class="btn-secondary" onclick="moveButton(this)">Isip muna ako </button>
    </div>

    <div id="forgiveMsg" class="hidden-message">
      Yonnnn! thank you Tine!  Pangako hindi na mauulit. Promise! 
    </div>
  </div>

  <script>
    function showForgiveness() {
      document.getElementById('forgiveMsg').style.display = 'block';
    }

    function moveButton(btn) {
      const x = Math.random() * (window.innerWidth - btn.offsetWidth - 40) - (window.innerWidth / 2 - btn.offsetWidth);
      const y = Math.random() * (window.innerHeight - btn.offsetHeight - 40) - (window.innerHeight / 2 - btn.offsetHeight);
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>
</body>
</html>
